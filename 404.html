<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages SPA redirect: lưu path vào sessionStorage rồi về index.html
    var path = location.pathname + location.search + location.hash;
    sessionStorage.setItem('__spa_redirect', path);
    location.replace('/');
  </script>
</head>
</html>
